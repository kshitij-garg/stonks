name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create release archive
        run: |
          mkdir -p release
          cp -r app.py analyzer.py csv_parser.py rebalancer.py test_integration.py requirements.txt start.bat start.sh README.md LICENSE docs data static release/
          cd release && zip -r ../quantrebalance-${{ github.ref_name }}.zip .
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: quantrebalance-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
